:root {
  --background: #111313;
  --foreground: #f4f3ed;
  --card: #191c1b;
  --card-foreground: #f4f3ed;
  --popover: #252925;
  --popover-foreground: #f4f3ed;
  --primary: #d9f477;
  --primary-foreground: #161d0b;
  --secondary: #282c27;
  --secondary-foreground: #f4f3ed;
  --muted: #252925;
  --muted-foreground: #a5aca3;
  --accent: #323a29;
  --accent-foreground: #f4f3ed;
  --destructive: #ff8e86;
  --border: #343931;
  --input: #42493d;
  --ring: #d9f477;
  --radius: .65rem;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Arial,Helvetica,sans-serif;
  font-size: 16px;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: .5;
}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 4px;
}
.shell {
  max-width: 1250px;
  margin: auto;
  padding: 0 44px;
}
.topbar {
  display: flex;
  align-items: center;
  gap: 22px;
  border-bottom: 1px solid var(--border);
  padding: 25px 0;
}
.brand {
  display: flex;
  align-items: center;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -1px;
  text-decoration: none;
  color: inherit;
}
.brand-icon {
  display: grid;
  place-items: center;
  background: var(--primary);
  color: #17220a;
  border-radius: 9px;
  width: 37px;
  height: 37px;
  margin-right: 10px;
}
.brand-dot {
  color: var(--primary);
}
.private {
  color: #959e92;
  font-size: 14px;
  flex: 1;
}
.topbar [data-slot=button] {
  font-size: 14px;
}
.heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 45px 0 32px;
}
.eyebrow {
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  margin: 0 0 10px;
}
h1 {
  font-size: clamp(32px,4vw,48px);
  font-weight: 600;
  letter-spacing: -1.8px;
  line-height: 1.12;
  margin: 0;
}
.random {
  height: 47px;
  padding: 0 20px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 9px;
}
.overview {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  background: #1b1f19;
  border: 1px solid #333b2c;
  border-radius: 12px;
  padding: 25px 30px;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 30px;
  border-right: 1px solid #3b4332;
}
.stat:first-child {
  padding-left: 0;
}
.stat:last-child {
  border: 0;
  padding-right: 0;
}
.stat>span,.progress-stat>div>span {
  color: #b4bdab;
  font-size: 14px;
}
.stat strong {
  font-size: 34px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -1px;
}
.stat strong small {
  font-size: 14px;
  font-weight: 400;
  color: #929d89;
  letter-spacing: 0;
}
.progress-stat {
  justify-content: center;
}
.progress-stat>div:first-child {
  display: flex;
  justify-content: space-between;
  gap: 14px;
}
.progress-stat b {
  font-size: 14px;
  font-weight: 400;
}
.progress-stat>small {
  color: #a7b09e;
  font-size: 13px;
}
.save-message {
  min-height: 22px;
  font-size: 13px;
  color: var(--primary);
  margin: 16px 0 10px;
}
.tabs-row {
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
}
.film-tabs {
  gap: 19px !important;
  height: auto !important;
  padding: 0 !important;
}
.film-tabs [data-slot=tabs-trigger] {
  padding: 12px 0 17px !important;
  font-size: 15px;
}
.film-tabs [data-slot=tabs-trigger][data-state=active] {
  color: var(--primary);
}
.film-tabs [data-slot=tabs-trigger]:after {
  bottom: 0 !important;
  background: var(--primary) !important;
}
.tab-count {
  font-size: 12px;
  padding: 2px 6px;
  background: #252a22;
  border-radius: 5px;
  margin-left: 4px;
  color: #b9c2af;
}
.filters {
  display: flex;
  gap: 12px;
  margin: 21px 0 7px;
}
.search {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  min-width: 140px;
  border: 1px solid var(--input);
  border-radius: 8px;
  padding: 0 13px;
  color: #949f8a;
  background: #191c18;
}
.search input {
  background: none;
  border: 0;
  width: 100%;
  padding: 12px 0;
  color: var(--foreground);
  font-size: 15px;
}
.search input:focus-visible {
  outline: none;
}
.search:focus-within {
  outline: 2px solid var(--primary);
}
.filters [data-slot=select-trigger] {
  height: 46px;
  font-size: 14px;
}
.results-meta {
  display: flex;
  justify-content: space-between;
  color: #8f9988;
  font-size: 13px;
  margin: 12px 0 11px;
}
.movie-list {
  border-top: 1px solid var(--border);
}
.movie {
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 91px;
  border-bottom: 1px solid #2a3027;
  padding: 17px 8px;
}
.movie:hover {
  background: #191d17;
}
.rank {
  width: 34px;
  color: #7f8b75;
  font: 13px ui-monospace,monospace;
}
.movie-title {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: none;
  border: 0;
  color: inherit;
  padding: 0;
}
.movie-title strong {
  display: block;
  font-size: 17px;
  font-weight: 500;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.movie-title>span {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 7px;
}
.movie-title i {
  font-size: 12px;
  font-style: normal;
  color: #9ba591;
}
.priority {
  padding: 3px 7px;
  border-radius: 4px;
  background: #262c22;
}
.priority.p1 {
  color: #ccdfab;
  background: #303c22;
}
.priority.p2 {
  color: #b8d4d9;
  background: #223235;
}
.rating {
  display: flex;
  gap: 4px;
  align-items: center;
  color: #e6d298 !important;
}
.queue-button {
  padding: 11px;
  color: #929e87;
  background: none;
  border: 0;
  border-radius: 7px;
}
.queue-button:hover {
  background: #30392a;
}
.queue-button.queued {
  color: var(--primary);
}
.watched-check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 119px;
  color: #a4ae9a;
  font-size: 14px;
  cursor: pointer;
}
.watched-check [data-slot=checkbox] {
  width: 20px;
  height: 20px;
}
.seen .movie-title strong {
  color: #b7c0af;
}
.seen .watched-check {
  color: var(--primary);
}
footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 30px 0;
  color: #86917b;
  font-size: 13px;
}
footer span:first-child {
  display: flex;
  gap: 9px;
  align-items: center;
}
.empty {
  padding: 64px 20px;
  text-align: center;
  color: #acb5a2;
}
.empty svg {
  margin: 0 auto 16px;
  color: var(--primary);
}
.empty h2 {
  font-size: 22px;
  color: var(--foreground);
  margin-bottom: 10px;
}
.movie-dialog {
  max-height: 90dvh;
  overflow-y: auto;
}
.movie-dialog [data-slot=dialog-title] {
  font-size: 24px;
  padding-right: 15px;
  line-height: 1.3;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
  margin-top: 4px;
}
.field [data-slot=select-trigger] {
  width: 100%;
  height: 42px;
}
.field textarea {
  background: #1b2018;
  color: var(--foreground);
  padding: 12px;
  border: 1px solid var(--input);
  border-radius: 7px;
  font: inherit;
  resize: vertical;
}
.queue-field {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  padding: 8px 0;
}
.error {
  background: #3c2421;
  color: #ffc6be;
  padding: 14px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
}
.error button {
  margin-left: 12px;
}
@media (max-width:760px) {
  .shell {
    padding: 0 20px;
  }
  .topbar {
    padding: 20px 0;
    justify-content: space-between;
  }
  .private {
    display: none;
  }
  .heading {
    margin: 30px 0 24px;
    align-items: flex-start;
    flex-direction: column;
    gap: 18px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 1px;
  }
  .overview {
    padding: 20px;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .stat {
    padding: 0;
    border: 0;
  }
  .progress-stat {
    grid-column: 1/-1;
    border-top: 1px solid var(--border) !important;
    padding-top: 20px !important;
  }
  .stat strong {
    font-size: 30px;
  }
  .filters {
    flex-wrap: wrap;
  }
  .search {
    flex-basis: 100%;
  }
  .filters [data-slot=select-trigger] {
    flex: 1;
    min-width: 0;
    font-size: 14px;
  }
  .film-tabs {
    gap: 20px !important;
  }
  .movie {
    gap: 10px;
    padding: 16px 0;
  }
  .rank {
    width: 26px;
    font-size: 12px;
  }
  .movie-title strong {
    font-size: 16px;
  }
  .watched-check {
    min-width: 32px;
    padding: 8px 3px;
  }
  .watched-check span {
    display: none;
  }
  .queue-button {
    padding: 8px;
  }
  .results-meta span:last-child {
    display: none;
  }
  footer {
    flex-direction: column;
    gap: 10px;
  }
  .random {
    width: 100%;
    justify-content: center;
  }
}
@media (max-width:760px) {
  .topbar {
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar .brand {
    flex-basis: 100%;
  }
  .topbar>[data-slot=button] {
    flex: 1;
  }
  .movie-dialog [data-slot=dialog-title] {
    overflow-wrap: anywhere;
  }
}
@supports (padding:max(0px)) {
  .shell {
    padding-left: max(20px,env(safe-area-inset-left));
    padding-right: max(20px,env(safe-area-inset-right));
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
}
@media (max-width:760px) {
  .search input,.field textarea {
    font-size: 16px;
  }
  .movie-title {
    min-height: 44px;
  }
  .queue-button {
    min-width: 44px;
    min-height: 44px;
  }
  .watched-check {
    min-width: 44px;
    min-height: 44px;
    justify-content: center;
  }
}
.cloud-account {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 24px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
}
.cloud-account strong {
  font-size: 16px;
}
.cloud-account p {
  font-size: 14px;
  color: var(--muted-foreground);
  margin: 6px 0 0;
  overflow-wrap: anywhere;
}
.cloud-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}
@media (max-width:760px) {
  .cloud-account {
    align-items: flex-start;
    flex-direction: column;
  }
  .cloud-account .cloud-actions {
    width: 100%;
  }
  .cloud-account button {
    min-height: 44px;
  }
}
